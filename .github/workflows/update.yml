name: Update NewsTrail

on:
  schedule:
    - cron: "7,27,47 * * * *"   # every 20 minutes — GitHub often delays scheduled runs, so we ask often
  workflow_dispatch:            # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write               # to save completed weeks into archive/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 28 days of headline history live in the Actions cache between runs
      - name: Restore history
        uses: actions/cache/restore@v4
        with:
          path: site/data/items.json
          key: newstrail-items-${{ github.run_id }}
          restore-keys: newstrail-items-

      # weeks already archived are served as they were published (never recomputed)
      - name: Restore weekly archive
        run: mkdir -p site/data/weeks && cp archive/weeks/*.json site/data/weeks/ 2>/dev/null || true

      - name: Collect headlines
        run: node scripts/collect.mjs
      - name: Build stories, patterns and statistics
        run: node scripts/build.mjs

      - name: Save history
        uses: actions/cache/save@v4
        with:
          path: site/data/items.json
          key: newstrail-items-${{ github.run_id }}

      - name: Archive completed weeks
        run: |
          mkdir -p archive/weeks
          new=0
          for f in site/data/weeks/20*.json; do
            [ -e "$f" ] || continue
            b=$(basename "$f"); [ -f "archive/weeks/$b" ] || { cp "$f" "archive/weeks/$b"; new=1; }
          done
          if [ "$new" = 1 ]; then
            git config user.name "newstrail-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add archive/weeks && git commit -m "Archive completed week(s)" && git pull --rebase && git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
